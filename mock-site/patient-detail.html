<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System A - Patient Detail</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; color: #0f172a; max-width: 760px; }
      .field { margin: 0.5rem 0; }
      label { font-weight: bold; display: inline-block; min-width: 140px; }
      .badge { background: #d1fae5; color: #065f46; padding: 2px 8px; border-radius: 6px; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Patient Record <span class="badge">MOCK DATA</span></h1>
    <div class="field"><label>MRN:</label><span data-field="mrn">PAT-00123</span></div>
    <div class="field"><label>Last Name:</label><span data-field="last-name">Doe</span></div>
    <div class="field"><label>First Name:</label><span data-field="first-name">John</span></div>
    <div class="field"><label>Date of Birth:</label><span data-field="dob">1985-03-15</span></div>
    <div class="field"><label>Gender:</label><span data-field="gender">male</span></div>
    <div class="field"><label>Phone:</label><span data-field="phone">+1 555-123-4567</span></div>
    <div class="field"><label>Email:</label><span data-field="email">john.doe@email.com</span></div>
    <div class="field"><label>Address:</label><span data-field="address">123 Main St</span></div>
    <div class="field"><label>City:</label><span data-field="city">Springfield</span></div>
    <div class="field"><label>State:</label><span data-field="state">IL</span></div>
    <div class="field"><label>ZIP:</label><span data-field="zip">62701</span></div>
    <div class="field"><label>Language:</label><span data-field="language">en</span></div>
  </body>
</html>
