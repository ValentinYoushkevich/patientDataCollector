<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SystemA - Partial Patient</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; background: #f1f5f9; color: #0f172a; }
      .card { max-width: 760px; border: 1px solid #cbd5e1; background: #fff; border-radius: 12px; overflow: hidden; }
      .head { background: #0f766e; color: #ecfeff; padding: 14px 16px; display: flex; justify-content: space-between; }
      .body { padding: 16px; }
      .links { margin-bottom: 14px; display: flex; gap: 12px; }
      .links a { color: #2563eb; text-decoration: none; font-weight: 700; }
      .warn { margin-bottom: 12px; padding: 10px; border: 1px solid #fcd34d; background: #fffbeb; color: #92400e; }
      .grid { display: grid; gap: 10px 12px; grid-template-columns: 160px 1fr; }
      .label { font-weight: 700; color: #334155; }
      .value { border: 1px solid #cbd5e1; background: #f8fafc; padding: 8px 10px; min-height: 34px; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="head">
        <strong>Patient Intake (Partial)</strong>
        <span>Some required fields are missing</span>
      </div>
      <div class="body">
        <div class="links">
          <a href="./patient-full.html">Open Full</a>
          <a href="./patient-profile.html">Open Profile (Practice Fusion)</a>
          <a href="./patient-summary.html">Open Summary (Practice Fusion)</a>
        </div>
        <div class="warn">This page intentionally leaves several required fields blank.</div>
        <div class="grid">
          <div class="label">First Name*</div>
          <input class="value" data-field="first-name" value="Jane" />
          <div class="label">Last Name*</div>
          <input class="value" data-field="last-name" value="Smith" />
          <div class="label">State*</div>
          <input class="value" data-field="state" value="" />
          <div class="label">Phone Number*</div>
          <input class="value" data-field="phone" value="" />
          <div class="label">Email*</div>
          <input class="value" data-field="email" value="" />
        </div>
      </div>
    </main>
  </body>
</html>
