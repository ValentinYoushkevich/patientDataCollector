<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SystemA - Partial Patient</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 24px; max-width: 760px; color: #0f172a; }
      .field { margin: 8px 0; }
      label { font-weight: bold; min-width: 150px; display: inline-block; }
      .badge { background: #fef3c7; color: #92400e; padding: 2px 8px; border-radius: 6px; font-size: 12px; }
      .muted { color: #94a3b8; font-style: italic; }
      .nav { margin: 16px 0 20px; display: flex; gap: 10px; flex-wrap: wrap; }
      .nav a { color: #2563eb; text-decoration: none; font-weight: 600; }
      .nav a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <h1>Patient Record <span class="badge">PARTIAL DATA</span></h1>
    <div class="nav">
      <a href="./patient-full.html">Go to Full</a>
      <a href="./patient-invalid.html">Go to Invalid</a>
    </div>

    <div class="field"><label>MRN:</label><span data-field="mrn">PAT-00456</span></div>
    <div class="field"><label>Last Name:</label><span data-field="last-name">Smith</span></div>
    <div class="field"><label>First Name:</label><span data-field="first-name">Jane</span></div>
    <div class="field"><label>Date of Birth:</label><span data-field="dob">1990-07-22</span></div>
    <div class="field"><label>Gender:</label><span data-field="gender">female</span></div>

    <div class="field"><label>Phone:</label><span data-field="phone" class="muted"></span></div>
    <div class="field"><label>Email:</label><span data-field="email" class="muted"></span></div>
    <div class="field"><label>Address:</label><span data-field="address" class="muted"></span></div>
    <div class="field"><label>City:</label><span data-field="city" class="muted"></span></div>
    <div class="field"><label>State:</label><span data-field="state" class="muted"></span></div>
    <div class="field"><label>ZIP:</label><span data-field="zip" class="muted"></span></div>
    <div class="field"><label>Language:</label><span data-field="language" class="muted"></span></div>
  </body>
</html>
